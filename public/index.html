<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12314b"><title>Control del hogar</title><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="auth" class="auth-shell"><div class="auth-card"><div class="mark" aria-hidden="true"></div><p class="eyebrow">CONTROL DEL HOGAR</p><h1 id="auth-title">Finanzas</h1><p id="auth-help">Creá una contraseña para proteger tus datos en esta computadora.</p><form id="auth-form"><label>Contraseña<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><label id="confirm-wrap">Repetir contraseña<input id="confirm-password" type="password" minlength="8" autocomplete="new-password"></label><button class="primary full" type="submit" id="auth-button">Crear espacio</button><p id="auth-error" class="error" role="alert"></p></form><p class="fine">Tus datos se cifran en este navegador. Para usarlos en otra computadora, descargá un respaldo y abrilo allí.</p></div></div>
<div id="app" hidden><aside class="sidebar"><div class="identity"><div class="mark" aria-hidden="true"></div><div><strong>Control del hogar</strong></div></div><nav id="nav"><button data-view="inicio" class="active">◫ <span>Resumen</span></button><button data-view="movimientos">⇄ <span>Movimientos</span></button><button data-view="tarjetas">▤ <span>Tarjetas</span></button><button data-view="vencimientos">◷ <span>Vencimientos</span></button><button data-view="prestamos">▦ <span>Préstamos</span></button><button data-view="documentos">▧ <span>Leer documentos</span></button><button data-view="configuracion">⚙ <span>Configuración</span></button></nav><div class="side-foot"><button id="lock" class="text-button">Cerrar</button></div></aside>
<main class="main"><header class="topbar"><div><p class="eyebrow">Gastos</p><h1 id="page-title">Resumen</h1><p id="connection-status" class="connection-status" role="status" aria-live="polite">Preparando uso sin conexión…</p></div><div class="top-actions"><label class="month-picker">Mes <input type="month" id="month"></label><button id="add-main" class="primary">+ Nuevo movimiento</button></div></header><div id="notice" class="notice" hidden></div><section id="view"></section></main></div>
<dialog id="modal"><form method="dialog" class="modal-head"><h2 id="modal-title">Nuevo movimiento</h2><button class="icon-btn" aria-label="Cerrar">×</button></form><div id="modal-body"></div></dialog>
<script type="module" src="app.js"></script></body></html>
